<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlankSlate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="config.js"></script>
    <script>
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=maps3d&v=beta&callback=initMap`;
        script.async = true;
        document.head.appendChild(script);

        script.onload = () => {
            initMap();
        };
    </script>

</head>

<body>
    <nav>
        <a href="index.html" class="navbar">BlankSlate</a>
        <a href="#about" class="navbar">About</a>
    </nav>

    <section class="container">
        <div id="toolbar">
            <h1>Draw</h1>
            <label for="stroke">Stroke</label>
            <input id="stroke" name="stroke" type="color" value="#ffffff">
            <label for="lineWidth">Line Width</label>
            <input type="range" min="1" max="20" value="5" id="lineWidth" name="lineWidth">
            <button id="clear" class="btn">Clear</button>
        </div>
        <div class="drawing-board">
            <canvas id="drawing-board"></canvas>
        </div>
    </section>
    <div class="mainControlsContainer">
        <div id="mainControls">
            <input type="text" value="41.9597" id="addMarkerLat" class="addMarkerText">
            <input type="text" value="88.1096" id="addMarkerLng" class="addMarkerText">
            <button id="addMarker" class="addMarkerText" style="padding: 0 16px;">Add Marker</button>
        </div>
        <button class="otherControls">
            <h4 id="testText"><svg id='addMarkerIcon' xmlns="http://www.w3.org/2000/svg" height="24px"
                    viewBox="0 -960 960 960" width="24px" fill="#8e8e8f">
                    <path
                        d="M480-80Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880h20q10 0 20 2v81q-10-2-19.5-2.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186q122-112 181-203.5T720-552v-8h80v8q0 100-79.5 217.5T480-80Zm0-400q33 0 56.5-23.5T560-560q0-33-23.5-56.5T480-640q-33 0-56.5 23.5T400-560q0 33 23.5 56.5T480-480Zm0-80Zm240-80h80v-120h120v-80H800v-120h-80v120H600v80h120v120Z" />
                </svg></h4>
        </button>
        <div id="map" style="width: 100%; height: 100vh; display: flex;"></div>


    </div>


    <script src="index.js"></script>
</body>

</html>
